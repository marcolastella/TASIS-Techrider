<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Svizzera Italiana</title>
<style>
  :root {
    --glass: rgba(255,255,255,.07);
    --glass-strong: rgba(255,255,255,.12);
    --stroke: rgba(255,255,255,.14);
    --text: #f4f6fb;
    --muted: rgba(244,246,251,.55);
    --gold: #d9b26f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: var(--text); background: #07080c; overflow: hidden;
  }

  /* ---------- sfondo ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(95px); opacity: .5; }
  .bg i:nth-child(1) { width: 640px; height: 640px; left: -180px; top: -220px; background: #c4153a; }
  .bg i:nth-child(2) { width: 580px; height: 580px; right: -160px; bottom: -240px; background: #1f5fd6; }
  .bg i:nth-child(3) { width: 460px; height: 460px; left: 40%; top: 35%; background: #e0a100; opacity: .22; }

  .glass {
    background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.03));
    border: 1px solid var(--stroke);
    border-radius: 28px;
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }

  .app {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-rows: auto 1fr; gap: 20px;
    padding: 24px 36px 28px;
  }

  /* ---------- banner ---------- */
  .banner {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 32px; position: relative; overflow: hidden;
  }
  .banner::after {
    content: ""; position: absolute; left: 12%; right: 12%; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand .t { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .brand .s { font-size: 14px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  .rds { text-align: center; font-size: 13px; color: var(--muted); margin-top: -8px; min-height: 18px;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rds.flash { animation: rdsIn .5s ease; }
  @keyframes rdsIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .clock {
    font-size: 46px; font-weight: 300; letter-spacing: .04em;
    font-variant-numeric: tabular-nums; line-height: 1;
    text-shadow: 0 2px 20px rgba(255,255,255,.12);
  }
  .clock small { font-size: 20px; color: var(--muted); margin-left: 4px; }
  .date { justify-self: end; text-align: right; }
  .date .d { font-size: 18px; font-weight: 500; }
  .date .w { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .main { display: grid; grid-template-columns: 1fr 300px; gap: 20px; min-height: 0; }

  /* ---------- menu radio (scorrevole) ---------- */
  .stations { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .sec-title { display: flex; justify-content: space-between; align-items: baseline; }
  .sec-title h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .sec-title span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .grid {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px; padding: 6px 8px 16px 4px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent;
    mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 22px), transparent 100%);
  }
  .grid::-webkit-scrollbar { width: 6px; }
  .grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 6px; }

  .station {
    position: relative; aspect-ratio: 1/1; width: 100%;
    border-radius: 24px; border: 1px solid var(--stroke); background: var(--glass);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: transform .25s ease, background .25s ease, box-shadow .35s ease, border-color .35s ease;
    user-select: none; outline: none; color: var(--text); font: inherit; padding: 12px;
  }
  .station:active { transform: scale(.96); }
  .station:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,.5); }
  .logo-box {
    width: 108px; height: 108px; flex: none; margin: 0 auto; border-radius: 24px; background: transparent;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 10px 22px rgba(0,0,0,.45);
  }
  /* il logo riempie tutto il quadrato stondato, senza margini */
  .logo-box img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .badge {
    width: 100%; height: 100%; display: none; align-items: center; justify-content: center;
    font-weight: 800; font-size: 24px; color: #fff; letter-spacing: -.03em;
  }
  .station .label { font-size: 13px; font-weight: 500; opacity: .92; text-align: center; line-height: 1.2; }
  .station .live {
    position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); opacity: 0; transition: opacity .3s;
  }
  .station.active {
    background: var(--glass-strong); border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 42px -6px var(--accent); transform: scale(1.03);
  }
  .station.active .live { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  .station.loading .live { opacity: 1; background: #ffffff88; animation: pulse .8s ease-in-out infinite; }
  .station.error { border-color: rgba(255,90,90,.6); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.6); opacity: .35 } }

  .status { font-size: 14px; color: var(--muted); min-height: 20px; }
  .status b { color: var(--text); font-weight: 500; }

  /* ---------- pannello destro: copertina, VU orizzontale, spegni ---------- */
  .vu { padding: 24px 22px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .vu > * { flex-shrink: 0; }
  .vu > .off { margin-top: auto; }
  .now-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .cover {
    flex: none; width: 100%; max-width: 210px; aspect-ratio: 1/1; margin: 0 auto; border-radius: 30px;
    background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
    transition: box-shadow .4s ease;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .cover.filled { border-color: transparent; }
  .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cover .badge { width: 100%; height: 100%; font-size: 56px; }
  .cover-empty { font-size: 14px; color: var(--muted); }
  .now-name { text-align: center; font-size: 16px; font-weight: 600; min-height: 22px; }
  .meters { display: flex; flex-direction: column; }
  .ch { width: 100%; }
  .vu-bar {
    width: 100%; height: 22px; display: flex; flex-direction: row; gap: 3px; padding: 5px;
    border-radius: 10px; background: #05060a; box-shadow: inset 0 2px 6px rgba(0,0,0,.9);
  }
  .seg { flex: 1; height: 100%; border-radius: 2px; background: #1b1e26; }
  .seg.g.lit { background: #4cff7a; box-shadow: 0 0 6px #4cff7a; }
  .seg.y.lit { background: #ffd23f; box-shadow: 0 0 6px #ffd23f; }
  .seg.r.lit { background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }
  /* pulsante SPEGNI: vetro elegante con icona dorata */
  .off {
    margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 20px; border-radius: 22px; cursor: pointer; text-align: left;
    border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: var(--text); font-family: inherit;
    box-shadow: 0 14px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16);
    transition: transform .15s ease, border-color .4s ease, box-shadow .4s ease, opacity .4s ease;
    opacity: .6;
  }
  .off .ico {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center;
    color: rgba(244,246,251,.85); transition: color .4s ease, filter .4s ease;
  }
  .off .ico svg { width: 22px; height: 22px; }
  .off .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .off .txt b { font-size: 21px; font-weight: 600; letter-spacing: .04em; }
  .off .txt small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .off:active { transform: scale(.98); }
  body.playing .off {
    opacity: 1; border-color: rgba(217,178,111,.45);
    box-shadow: 0 14px 32px rgba(0,0,0,.35), 0 0 34px -10px rgba(217,178,111,.55), inset 0 1px 0 rgba(255,255,255,.2);
  }
  body.resume .off { opacity: 1; }
  body.playing .off .ico { color: var(--gold); filter: drop-shadow(0 0 6px rgba(217,178,111,.55)); }
</style>
</head>
<body>

<div class="bg"><i></i><i></i><i></i></div>

<div class="app">

  <!-- ===== BANNER ===== -->
  <header class="banner glass">
    <div class="brand">
      <span class="t">TASIS Lavanderia</span>
      <span class="s">Radio Svizzera Italiana</span>
    </div>
    <div class="clock" id="clock">--:--<small>:--</small></div>
    <div class="date">
      <div class="d" id="date">—</div>
      <div class="w" id="weekday">—</div>
    </div>
  </header>

  <div class="main">

    <!-- ===== MENU RADIO ===== -->
    <section class="glass stations">
      <div class="sec-title"><h2>Stazioni</h2><span id="count">Scorri per vedere tutte</span></div>
      <div class="grid" id="grid"></div>
      <div class="status" id="status">Nessuna radio in riproduzione.</div>
    </section>

    <!-- ===== VU METER ===== -->
    <section class="glass vu">
      <div class="now-label">In ascolto</div>
      <div class="cover" id="cover"><span class="cover-empty">Nessuna radio</span></div>
      <div class="now-name" id="nowName">—</div>
      <div class="rds" id="rds">In attesa di una radio</div>
      <div class="meters" id="meters"></div>
      <button class="off" id="offBtn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3.5v8"/><path d="M6.6 7.2a7.5 7.5 0 1 0 10.8 0"/></svg></span><span class="txt"><b id="offLabel">Spegni</b></span></button>
    </section>

  </div>
</div>

function tickClock() {

}

/* ---------------- risoluzione stream ---------------- */
// restituisce TUTTI gli stream candidati (in ordine di popolarità): se il primo non parte, si prova il successivo
async function resolveStreams(st) {
  if (st.url) return Array.isArray(st.url) ? st.url : [st.url];
  if (urlCache[st.id]) return urlCache[st.id];
  const q = encodeURIComponent(st.search);
  const api = `https://de1.api.radio-browser.info/json/stations/search?name=${q}&countrycode=${st.cc || 'CH'}&order=clickcount&reverse=true&limit=30`;
  const res = await fetch(api);
  if (!res.ok) throw new Error('ricerca non riuscita');
  const list = await res.json();
  const key = st.search.toLowerCase();
  const urls = [];
  list.forEach(s => {
    if (s.lastcheckok === 0) return;   // scarta gli stream che il directory segnala come non funzionanti
    const n = (s.name || '').toLowerCase();
    const u = s.url_resolved || s.url;
    if (u && n.includes(key) && (!st.exclude || !n.includes(st.exclude)) && !urls.includes(u)) urls.push(u);
  });
  if (!urls.length) throw new Error('stream non trovato');
  urlCache[st.id] = urls;
  return urls;
}

// ricerca alternativa per nome sul directory, usata se lo stream salvato non risponde
async function fallbackStreams(st) {
  const key = st.name.toLowerCase();
  const api = `https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(st.name)}&order=clickcount&reverse=true&limit=30`;
  const res = await fetch(api);
  if (!res.ok) throw new Error('ricerca non riuscita');
  const list = await res.json();
  const urls = [];
  list.forEach(x => {
    const n = (x.name || '').toLowerCase();
    const u = x.url_resolved || x.url;
    if (u && x.lastcheckok !== 0 && n.includes(key) && !urls.includes(u)) urls.push(u);
  });
  return urls;
}

/* ---------------- audio ---------------- */
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// crea un nodo audio. Con analyser (CORS ok) alimenta i VU meter; senza, suona direttamente
function makeNode(withAnalyser) {
  const el = new Audio();
  el.preload = 'auto';
  el.setAttribute('playsinline', '');
  if (withAnalyser) {
    el.crossOrigin = 'anonymous';
    const src = audioCtx.createMediaElementSource(el);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser).connect(audioCtx.destination);
    return { el, src, analyser, data: new Uint8Array(analyser.fftSize), peak: 0 };
  }
  return { el, analyser: null, data: null, peak: 0 };
}

const RDS_DEFAULT = 'In attesa di una radio';
let rdsTimer = null;

// legge il titolo in onda dal server Icecast che ospita lo stream (status-json.xsl)
async function fetchNowPlaying(streamUrl) {
  const u = new URL(streamUrl);
  const res = await fetch(`${u.origin}/status-json.xsl`, { cache: 'no-store' });
  if (!res.ok) throw new Error('metadati non disponibili');
  const j = await res.json();
  const src = j.icestats && j.icestats.source;
  if (!src) return null;
  const list = Array.isArray(src) ? src : [src];
  const hit = list.find(s => s.listenurl && s.listenurl.endsWith(u.pathname)) || list[0];
  return hit.title || hit.yp_currently_playing || null;
}

function setRds(text) {
  const el = $('#rds');
  el.textContent = text;
  el.classList.remove('flash');
  void el.offsetWidth;          // riavvia l'animazione di ingresso
  el.classList.add('flash');
}

function stopRds() {
  clearInterval(rdsTimer);
  rdsTimer = null;
  setRds(RDS_DEFAULT);
}

function startRds(streamUrl, st) {
  stopRds();
  if (!streamUrl) { setRds('In diretta'); return; }
  const update = async () => {
    try {
      const t = await fetchNowPlaying(streamUrl);
      setRds(t ? `♪ ${t}` : 'In diretta');
    } catch (e) {
      setRds('In diretta');
    }
  };
  update();
  rdsTimer = setInterval(update, 15000);
}

/* ---------------- copertina della radio in ascolto ---------------- */
function showCover(st) {
  const box = $('#cover');
  $('#nowName').textContent = st ? st.name : '—';
  document.body.classList.toggle('playing', !!st);
  document.body.classList.toggle('resume', !st && !!lastStation);
  $('#offLabel').textContent = (!st && lastStation) ? 'Accendi' : 'Spegni';
  box.classList.toggle('filled', !!st);
  if (!st) {
    box.style.background = 'rgba(255,255,255,.06)';
    box.innerHTML = '<span class="cover-empty">Nessuna radio</span>';
    return;
  }
  box.style.background = st.logo ? 'transparent' : `linear-gradient(145deg, ${st.color}, ${shade(st.color, -35)})`;
  box.innerHTML = `${st.logo ? `<img alt="${st.name}" src="${st.logo}" referrerpolicy="no-referrer"
       onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.parentElement.style.background='${st.color}';">` : ''}
    <div class="badge" style="display:${st.logo ? 'none' : 'flex'};background:linear-gradient(145deg, ${st.color}, ${shade(st.color, -35)})">${st.mark}</div>`;
}

/* ---------------- stop ---------------- */
function stopAll() {
  playToken++;
  stopRds();
  showCover(null);
  // smonta del tutto l'audio: nessun elemento resta pronto a ripartire
  zoneNodes.forEach(n => {
    try { n.el.pause(); n.el.removeAttribute('src'); n.el.load(); } catch (e) {}
    try { if (n.src) n.src.disconnect(); if (n.analyser) n.analyser.disconnect(); } catch (e) {}
  });
  zoneNodes.length = 0;
  if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
  if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'none'; navigator.mediaSession.metadata = null; } catch (e) {} }
  current = null;
  document.querySelectorAll('.station').forEach(b => b.classList.remove('active', 'loading', 'error'));
  setStatus('Nessuna radio in riproduzione.');
}

/* ---------------- play / toggle ---------------- */
async function onStationClick(st, btn) {
  // stessa radio attiva -> spegni
  if (current === st) { stopAll(); return; }

  stopAll();                    // cambio radio: ferma la precedente
  ensureCtx();                  // riattiva l'audio dopo lo stop (sempre dentro il tocco)
  const token = playToken;
  current = st;
  showCover(st);                // la copertina compare subito al click
  btn.classList.add('loading');
  setStatus(`Carico <b>${st.name}</b>…`);

  let urls;
  try {
    urls = await resolveStreams(st);
  } catch (err) {
    if (token !== playToken) return;
    btn.classList.remove('loading');
    btn.classList.add('error');
    setStatus(`${st.name}: stream non disponibile (${err.message}).`);
    current = null;
    return;
  }
  if (token !== playToken) return;   // nel frattempo è stata scelta un'altra radio

  // prova gli stream candidati uno alla volta finché uno parte
  let won = null, lastErr = null;
  const attempt = async (list) => {
    for (const url of list) {
      const isHls = /\.m3u8(\?|$)/i.test(url);
      for (const withAnalyser of (isHls ? [false] : [true, false])) {
        if (token !== playToken) return false;
        const node = makeNode(withAnalyser);
        zoneNodes.length = 0;
        zoneNodes.push(node);
        node.el.src = url;
        try {
          await node.el.play();
          won = url;
          return true;
        } catch (e) {
          lastErr = e;
          node.el.pause();
          node.el.removeAttribute('src');
          node.el.load();
        }
      }
    }
    return false;
  };
  let started = await attempt(urls);
  if (!started && token === playToken) {
    // lo stream salvato non risponde: cerca un'altra sorgente con lo stesso nome
    setStatus(`Cerco un altro stream per <b>${st.name}</b>…`);
    try { started = await attempt(await fallbackStreams(st)); } catch (e) { lastErr = lastErr || e; }
  }
  if (token !== playToken) return;

  btn.classList.remove('loading');
  if (!started) {
    btn.classList.add('error');
    setStatus(`${st.name}: nessuno stream risponde (${lastErr ? lastErr.name : 'errore'}).`);
    current = null;
    showCover(null);
    return;
  }
  btn.classList.add('active');
  btn.style.setProperty('--accent', st.color);
  setStatus(`In riproduzione: <b>${st.name}</b>`);
  lastStation = st;
  showCover(st);
  startRds(won, st);
}

/* ---------------- menu radio ---------------- */
function buildStations() {
  const grid = $('#grid');
  STATIONS.forEach(st => {
    const btn = document.createElement('button');
    btn.className = 'station';
    btn.style.setProperty('--accent', st.color);
    btn.setAttribute('aria-label', st.name);
    btn.innerHTML = `
      <span class="live"></span>
      <div class="logo-box">
        <img alt="${st.name}" src="${st.logo}" referrerpolicy="no-referrer"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.parentElement.style.background='${st.color}';">
        <div class="badge" style="background:linear-gradient(145deg, ${st.color}, ${shade(st.color, -35)})">${st.mark}</div>
      </div>
      <span class="label">${st.name}</span>`;
    st._btn = btn;
    btn.addEventListener('click', () => onStationClick(st, btn));
    grid.appendChild(btn);
  });
  $('#count').textContent = `${STATIONS.length} emittenti · scorri`;
}

/* ---------------- VU meter (solo indicatori, niente fader) ---------------- */
function buildMeters() {
  const wrap = $('#meters');
  ZONES.forEach((name, i) => {
    const ch = document.createElement('div');
    ch.className = 'ch';
    ch.innerHTML = `<div class="vu-bar">${Array.from({ length: SEGMENTS }, () => '<div class="seg"></div>').join('')}</div>`;
    wrap.appendChild(ch);
    const segs = [...ch.querySelectorAll('.seg')];
    segs.forEach((s, k) => s.classList.add(k >= SEGMENTS - 3 ? 'r' : k >= SEGMENTS - 9 ? 'y' : 'g'));
    ch._refs = { segs };
    ch._zone = i;
    zoneMeters.push(ch);
  });
}
const zoneMeters = [];

function animateMeters() {
  zoneMeters.forEach((ch) => {
    const node = zoneNodes[ch._zone];
    let level = 0;
    if (node && current && node.analyser) {
      node.analyser.getByteTimeDomainData(node.data);
      let sum = 0;
      for (let k = 0; k < node.data.length; k++) {
        const v = (node.data[k] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / node.data.length);
      level = Math.min(1, rms * 3.2);
    }
    else if (node && current && !node.el.paused) {
      // stream senza dati audio leggibili (CORS): simulazione del movimento del VU
      const t = performance.now() / 1000;
      level = Math.max(0, Math.min(1, 0.5 + 0.22 * Math.sin(t * 4.7) * Math.sin(t * 1.9) + (Math.random() - 0.5) * 0.3));
    }
    // caduta lenta del picco, come un vero VU
    node && (node.peak = Math.max(level, (node.peak || 0) - 0.025));
    const shown = node ? node.peak : 0;
    const lit = Math.round(shown * SEGMENTS);
    ch._refs.segs.forEach((s, k) => s.classList.toggle('lit', k < lit));
  });
  requestAnimationFrame(animateMeters);
}

/* piccola utilità per scurire un colore esadecimale */
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.max(0, Math.min(255, v));
  const r = c((n >> 16) + pct), g = c(((n >> 8) & 255) + pct), b = c((n & 255) + pct);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---------------- avvio ---------------- */
$('#offBtn').addEventListener('click', () => {
  if (current) stopAll();
  else if (lastStation) onStationClick(lastStation, lastStation._btn);
});
buildStations();
buildMeters();
requestAnimationFrame(animateMeters);
// le zone audio vengono create al primo play (buildZoneAudio); i meter restano a zero fino ad allora
</script>
